<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Login — FixMyCity</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-brand">
<span class="nav-icon">
  <img src="/pho/logo.jpeg" alt="FixMyCity Logo" style="width:40px;height:40px;object-fit:contain;">
</span>        <span> <span>FixMyCity</span></span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
      </div>
    </div>
  </nav>

  <div class="auth-container">
    <div style="text-align:center; margin-bottom:2rem;">
<h1 style="display:flex; align-items:center; justify-content:center; gap:15px; font-size:2.2rem;">
  <img src="/pho/logo.jpeg" alt="FixMyCity Logo"
       style="width:70px; height:70px; object-fit:contain;">
  <span>FixMyCity</span>
</h1>      <p style="color:var(--text-secondary); margin-top:8px;">Citizen Authentication Portal</p>
    </div>

    <div class="card auth-card">
      <!-- Dummy inputs to trick browser autofill -->
      <input type="text" style="display:none" autocomplete="username">
      <input type="password" style="display:none" autocomplete="current-password">
      
      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('register')">Register</div>
      </div>

      <!-- Login Panel -->
      <div id="loginPanel" class="panel active">
        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label">Aadhaar Number (12 digits)</label>
            <input type="text" id="loginAadhaar" name="citizen_aadhaar" class="form-control aadhaar-input" maxlength="12" placeholder="XXXX XXXX XXXX" required autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="loginPhone" name="citizen_phone" class="form-control" placeholder="10-digit mobile number" maxlength="10" required autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary w-full mt-2">Login</button>
        </form>
      </div>

      <!-- Register Panel -->
      <div id="registerPanel" class="panel">
        <form id="registerForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="regName" name="citizen_name" class="form-control" placeholder="e.g. P Sri Chaitanya" required autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Aadhaar Number</label>
            <input type="text" id="regAadhaar" name="citizen_aadhaar_reg" class="form-control aadhaar-input" maxlength="12" placeholder="XXXX XXXX XXXX" required autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="regPhone" name="citizen_phone" class="form-control" placeholder="10-digit mobile number" maxlength="10" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="regEmail" name="citizen_email" class="form-control" placeholder="your@email.com" autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary w-full mt-2">Register & Login</button>
        </form>
      </div>
    </div>
    
    <div style="text-align:center; margin-top:2rem;">
      <a href="/admin/login" style="color:var(--text-secondary); font-size:0.85rem; text-decoration:none;">Go to Administrative Login</a>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/shared/auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
