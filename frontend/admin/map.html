<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map View — FixMyCity</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <style>
    body, html { height: 100%; overflow: hidden; }
    #adminMap { height: calc(100vh - 64px); width: 100%; }
    .map-sidebar {
      position: absolute; top: 80px; right: 20px; z-index: 1000;
      width: 320px; max-height: 80vh; overflow-y: auto;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.5rem; color: var(--text-primary); box-shadow: var(--shadow);
    }
    .popup-content { color: #333; min-width: 200px; }
    .popup-photo { width: 100%; border-radius: 4px; margin: 8px 0; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/admin/dashboard" class="nav-brand">
<span class="nav-icon">
  <img src="/pho/logo.jpeg" alt="FixMyCity Logo" style="width:40px;height:40px;object-fit:contain;">
</span>        <span>FixMyCity <span>Admin</span></span>
      </a>
      <div class="nav-links">
        <a href="/admin/dashboard">List View</a>
        <a href="/admin/map" class="active">Map View</a>
        <a href="#" onclick="Auth.logout()">Logout</a>
      </div>
    </div>
  </nav>

  <div id="adminMap"></div>

  <div class="map-sidebar">
    <h3 class="mb-3">Filter Map</h3>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select id="mapCat" class="form-control" onchange="loadMapData()">
        <option value="">All Categories</option>
        <option value="Road">Road</option>
        <option value="Water">Water</option>
        <option value="Electricity">Electricity</option>
        <option value="Sanitation">Sanitation</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select id="mapStatus" class="form-control" onchange="loadMapData()">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
      </select>
    </div>
    <hr class="mb-3" style="border: 0; border-top: 1px solid var(--border)">
    <div id="statsBox">
      <p class="text-secondary text-sm">Showing <span id="visibleCount" class="text-accent">0</span> complaints on map.</p>
    </div>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script>
    Auth.requireAuth('admin');

    let map, markers;
    const STATUS_COLORS = {
      'Pending': '#f59e0b',
      'In Progress': '#3b82f6',
      'Resolved': '#10b981',
      'Rejected': '#ef4444'
    };

    function initMap() {
      map = L.map('adminMap').setView([28.6139, 77.2090], 11);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; FixMyCity'
      }).addTo(map);

      markers = L.markerClusterGroup();
      map.addLayer(markers);
      loadMapData();
    }

    async function loadMapData() {
      const cat = document.getElementById('mapCat').value;
      const status = document.getElementById('mapStatus').value;
      
      try {
        const res = await fetch(`/api/complaints/all?status=${status}&category=${cat}`, {
          headers: Auth.getAuthHeaders()
        });
        const data = await res.json();
        renderMarkers(data.complaints || []);
      } catch (err) {
        console.error(err);
      }
    }

    function renderMarkers(complaints) {
      markers.clearLayers();
      const geotagged = complaints.filter(c => c.lat && c.lng);
      document.getElementById('visibleCount').textContent = geotagged.length;

      geotagged.forEach(c => {
        const marker = L.marker([c.lat, c.lng]);
        
        marker.bindPopup(`
          <div class="popup-content">
            <strong style="color:var(--accent)">${c.complaint_id}</strong><br>
            <strong>Status:</strong> ${c.status}<br>
            <strong>Category:</strong> ${c.category}<br>
            <p style="margin:5px 0; font-size:12px">${c.description.substring(0, 100)}...</p>
            ${c.photo_url ? `<img src="${c.photo_url}" class="popup-photo">` : ''}
            <a href="/admin/dashboard?id=${c.complaint_id}" style="color:blue">View Details</a>
          </div>
        `);
        markers.addLayer(marker);
      });

      if (geotagged.length > 0) {
        map.fitBounds(markers.getBounds(), { padding: [50, 50] });
      }
    }

    initMap();
  </script>
</body>
</html>
