<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — FixMyCity</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="login1.css">
</head>
<body>
  <div class="auth-container">
    <div style="text-align:center; margin-bottom:2rem;">
      <h1 style="font-size:1.8rem;"> Admin <span>Portal</span></h1>
      <p style="color:var(--text-secondary); margin-top:8px;">FixMyCity Staff Login</p>
    </div>

    <div class="card auth-card">
      <!-- Dummy inputs to trick browser autofill -->
      <input type="text" style="display:none" autocomplete="username">
      <input type="password" style="display:none" autocomplete="current-password">
      
      <form id="adminLoginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label">Staff Email</label>
          <input type="email" id="adminEmail" name="staff_ident" class="form-control" placeholder="admin@fixmycity.gov" required autocomplete="none">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="adminPassword" name="staff_key" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-full mt-2">Sign In</button>
      </form>
    </div>
    
    <div style="text-align:center; margin-top:2rem;">
      <a href="/citizen/login" style="color:var(--text-secondary); font-size:0.85rem; text-decoration:none;">Back to Citizen Portal</a>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/shared/auth.js"></script>
  <script src="login1.js"></script>
</body>
</html>
