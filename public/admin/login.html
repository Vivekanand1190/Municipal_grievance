<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Municipal Grievance System</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    .auth-container { max-width: 400px; margin: 8rem auto; padding: 0 1rem; }
    .auth-card { padding: 2.5rem; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div style="text-align:center; margin-bottom:2rem;">
      <h1 style="font-size:1.8rem;">🏛️ Admin <span>Portal</span></h1>
      <p style="color:var(--text-secondary); margin-top:8px;">Municipal Staff Login</p>
    </div>

    <div class="card auth-card">
      <!-- Dummy inputs to trick browser autofill -->
      <input type="text" style="display:none" autocomplete="username">
      <input type="password" style="display:none" autocomplete="current-password">
      
      <form id="adminLoginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label">Staff Email</label>
          <input type="email" id="adminEmail" name="staff_ident" class="form-control" placeholder="admin@municipality.gov" required autocomplete="none">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="adminPassword" name="staff_key" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-full mt-2">Sign In</button>
      </form>
    </div>
    
    <div style="text-align:center; margin-top:2rem;">
      <a href="/citizen/login" style="color:var(--text-secondary); font-size:0.85rem; text-decoration:none;">← Back to Citizen Portal</a>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/shared/auth.js"></script>
  <script>
    document.getElementById('adminLoginForm').onsubmit = async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        Auth.saveSession(data.token, data.user);
        showToast('Authenticated. Opening dashboard...', 'success');
        setTimeout(() => window.location.href = '/admin/dashboard', 1000);
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.className = `toast-${type} show`;
      toast.innerHTML = `<strong>${type === 'success' ? '✅' : '❌'}</strong> ${msg}`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
