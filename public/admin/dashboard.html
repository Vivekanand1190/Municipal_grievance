<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Municipal Grievance System</title>
  <link rel="stylesheet" href="/shared/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }
    .table-card { padding: 1.5rem; margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .photo-cell { width: 60px; height: 60px; border-radius: 4px; object-fit: cover; }
    .priority-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .priority-high { background: rgba(239,68,68,0.2); color: #ef4444; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/admin/dashboard" class="nav-brand">
        <span class="nav-icon">🏛️</span>
        <span>Municipal <span>Admin</span></span>
      </a>
      <div class="nav-links">
        <a href="/admin/dashboard" class="active">List View</a>
        <a href="/admin/map">Map View</a>
        <a href="#" onclick="Auth.logout()">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:flex-end">
      <div>
        <h1>🏗️ Municipal Dashboard</h1>
        <p class="text-secondary">System Statistics and Grievance Management</p>
      </div>
      <div class="text-secondary text-sm">Welcome, <span id="adminName" class="text-accent font-bold">...</span></div>
    </div>

    <!-- Stat Cards -->
    <div class="grid" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:1.5rem; margin-top:2rem;">
      <div class="stat-card">
        <div class="stat-label">Total Grievances</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Citizens Registered</div>
        <div class="stat-value" id="statCitizens">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Issues</div>
        <div class="stat-value" id="statPending" style="color:var(--status-pending)">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High Priority</div>
        <div class="stat-value" id="statHigh" style="color:var(--status-rejected)">0</div>
      </div>
    </div>

    <!-- Table -->
    <div class="card table-card">
      <div style="display:flex; gap:1rem; margin-bottom:1.5rem;">
        <select id="filterStatus" class="form-control" style="width:200px" onchange="loadComplaints()">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
        <select id="filterCategory" class="form-control" style="width:200px" onchange="loadComplaints()">
          <option value="">All Categories</option>
          <option value="Road">Road</option>
          <option value="Water">Water</option>
          <option value="Electricity">Electricity</option>
          <option value="Sanitation">Sanitation</option>
        </select>
        <input type="text" id="adminSearch" class="form-control" placeholder="Search ID or description..." oninput="loadComplaints()">
      </div>

      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Photo</th>
              <th>Details</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="complaintsBody">
            <!-- Data here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/shared/auth.js"></script>
  <script>
    Auth.requireAuth('admin');
    document.getElementById('adminName').textContent = Auth.getUser().name;

    async function loadStats() {
      const res = await fetch('/api/complaints/stats', { headers: Auth.getAuthHeaders() });
      const { stats } = await res.json();
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statCitizens').textContent = stats.totalCitizens;
      document.getElementById('statPending').textContent = stats.byStatus.Pending;
      document.getElementById('statHigh').textContent = stats.byPriority.High;
    }

    async function loadComplaints() {
      const status = document.getElementById('filterStatus').value;
      const category = document.getElementById('filterCategory').value;
      const search = document.getElementById('adminSearch').value.toLowerCase();

      const res = await fetch(`/api/complaints/all?status=${status}&category=${category}`, {
        headers: Auth.getAuthHeaders()
      });
      const data = await res.json();
      
      let list = data.complaints;
      if (search) {
        list = list.filter(c => c.complaint_id.toLowerCase().includes(search) || c.description.toLowerCase().includes(search));
      }

      renderTable(list);
    }

    function renderTable(list) {
      const body = document.getElementById('complaintsBody');
      body.innerHTML = list.map(c => `
        <tr>
          <td style="font-family:monospace; font-weight:700; color:var(--accent)">${c.complaint_id}</td>
          <td>${c.photo_url ? `<img src="${c.photo_url}" class="photo-cell">` : '<div class="photo-cell" style="background:#222; display:flex; align-items:center; justify-content:center; font-size:10px">No Photo</div>'}</td>
          <td>
            <div style="max-width:300px; font-size:0.9rem">${c.description.substring(0, 100)}${c.description.length > 100 ? '...' : ''}</div>
            <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:4px">📍 ${c.location || 'Unknown'}</div>
          </td>
          <td><span class="tag tag-${c.category.toLowerCase()}">${c.category}</span></td>
          <td><span class="priority-badge ${c.priority === 'High' ? 'priority-high' : ''}">${c.priority}</span></td>
          <td><span class="badge badge-${c.status.toLowerCase().replace(/\s+/g,'')}">${c.status}</span></td>
          <td>
            <select class="form-control" style="width:130px; padding:4px 8px; font-size:0.8rem" onchange="updateStatus('${c.complaint_id}', this.value)">
              <option value="Pending" ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Resolved" ${c.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`/api/complaints/${id}/status`, {
          method: 'PATCH',
          headers: { ...Auth.getAuthHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (!res.ok) throw new Error('Update failed');
        showToast('Status updated successfully.', 'success');
        loadStats();
        loadComplaints();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.className = `toast-${type} show`;
      toast.innerHTML = `<strong>${type === 'success' ? '✅' : '❌'}</strong> ${msg}`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    loadStats();
    loadComplaints();
  </script>
</body>
</html>
